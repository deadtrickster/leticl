name: Release

# Assets, built on a tag. This is what install.sh downloads:
#
#   curl -fsSL https://raw.githubusercontent.com/deadtrickster/leticl/main/install.sh | sh
#
# One asset per triple, `leticl-<triple>.tar.gz`, holding BOTH binaries and the
# launcher scripts, with every file at the archive root:
#
#   leticl-head          the head image          (this repo, freeze.lisp)
#   harnessd             the daemon              (deadtrickster/letibot)
#   letibot              the launcher            (deadtrickster/letibot)
#   leticl               the seat + the head hook        (this repo, scripts/)
#   leticl-head-launch   the argument translator         (this repo, scripts/)
#
# **ONE ASSET AND NOT TWO.** `leticl` is only a head, and it draws a daemon that
# lives in another repository with its own tags. Fetching two assets from two
# repositories would mean two version variables and two ways to half-install, so
# this workflow builds both and ships one archive. `scripts/make-dist.sh` owns the
# names and asserts the contents; this file does not restate them.
#
# **The head needs no toolchain at install time.** `freeze.lisp` saves it with
# `:executable t`, so it carries SBCL's runtime — measured with `ldd`: libzstd,
# libm, libc and nothing else. SBCL is a BUILD dependency here and only here. The
# image does need `libsqlite3.so.0` at run time for the todo store, which the
# installer checks and names.
#
# **WHAT `act` FOUND, AND WHAT I GOT WRONG READING IT BACK.** The first run of this
# workflow failed with a dependency error, and the note that stood here claimed the cause
# was letibot's: *"three of its manifests take rano as an ABSOLUTE PATH dependency …
# harnessd cannot be built anywhere but the author's box."*
#
# **That was false, and it was false when I wrote it.** letibot's three manifests take rano
# by GIT TAG, and did at the time:
#
#   crates/ui/Cargo.toml:52   rano = { git = "https://github.com/deadtrickster/rano", tag = "v0.2.1" }
#
# What I read were the COMMENTS above those lines, three of which still said *"the absolute
# path is deliberate: rano is an operator-local project"* — prose describing a decision the
# lines no longer made. The same decay R53 §7.1 measured between these two trees, this time
# inside one of them, and it is why the paragraph is kept here in corrected form rather than
# deleted: **a comment about a dependency is a claim with a lifetime, and when the line
# changes the comment is what lies.** A reader checking that dependency reads the prose.
#
# The absolute path that DID exist was in this repository — `native/hl/Cargo.toml`, the
# highlighting shim, now pinned to the same `v0.2.1`. That is why no archive ever carried
# `libleticl_hl.so` and every fresh install ran uncoloured without saying so.
# Linux x86_64 and aarch64 build natively on GitHub's own runners. **macOS is NOT
# covered yet**: the head would need `brew install sbcl` on the runner and the
# image's Lisp-side paths are only exercised on Linux today. Named here rather
# than silently absent, so an installer on a Mac says "no asset" instead of
# fetching something that has never been built.

on:
  push:
    tags: ['v*']
  # Build the assets without publishing, to test a change to this file.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # **THE DAEMON'S REPOSITORY AND TAG, and this was `main` until letibot had a release.**
  # The comment here used to instruct: *"A ref rather than a tag because letibot has no release
  # of its own to pin against yet; when it does, this becomes the tag and stops moving under a
  # rebuild of an old leticl tag."* That is this change — the condition was met, so the
  # instruction fired rather than being remembered.
  #
  # A TAG and not `main`, and letibot's own choice makes the reason concrete: it tagged a
  # VERIFIED commit rather than the head of `main`, deliberately — the commit its green matrix
  # actually built. So the pin is the thing that was tested.
  #
  # **AND THE LAUNCHER NEEDS A SECOND REF, WHICH IS NOT A DUPLICATION BUT A MEASUREMENT.**
  # `LETIBOT_REF` names a TAG because release ASSETS hang off tags — `releases/download/<tag>/`
  # is the only form that resolves. But `v0.1.1` was cut at 11:23 and the launcher gained its
  # `LETIBOT_HEAD` hook at `ba97dbf`, 14:09 — so the tag's launcher is 901 lines with zero
  # matches for that name, and an install composed from it would ship a launcher that ignores
  # the head we point it at. MEASURED, by fetching both:
  #
  #   raw.githubusercontent.com/.../v0.1.1/scripts/letibot    901 lines, 0 × LETIBOT_HEAD
  #   raw.githubusercontent.com/.../ba97dbf/scripts/letibot  1123 lines, has it
  #
  # So the asset comes from the tag and the SCRIPT comes from the commit that has the hook. A
  # commit id is at least as immutable as a tag — more, since a tag can be moved — so pinning
  # one is not a weaker promise, it is the same one.
  #
  # **WHEN letibot CUTS A TAG CONTAINING `ba97dbf`, BOTH COLLAPSE TO IT** and this second variable
  # goes away. That is the instruction, same shape as the one this comment replaced.
  LETIBOT_REPO: deadtrickster/letibot
  LETIBOT_REF: v0.1.1
  LETIBOT_LAUNCHER_REF: ba97dbf
  # **rano IS PINNED BY TAG, in the manifests that need it** — `native/hl/Cargo.toml`
  # and letibot's three. Not an env var here, because a dependency's version belongs
  # where the dependency is declared; this comment exists so a reader looking for
  # "which rano" finds the answer instead of wondering.

jobs:
  build:
    runs-on: ${{ matrix.runs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runs: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - name: Check out the head
        uses: actions/checkout@v4

      # **THE DAEMON IS FETCHED, NOT BUILT, AND THAT IS A CHANGE OF DESIGN.**
      #
      # The first cut checked letibot out and ran `cargo build`, which cannot work: `letibot-tokencore`'s
      # build script needs `llama.h` and `libllama.so` from a llama.cpp checkout, defaulting to the
      # author's own path. MEASURED on the first `act` run:
      #
      #   thread 'main' panicked at crates/tokencore/build.rs:27:5:
      #   llama.h not found at /home/dead/Projects/llama.cpp/include/llama.h.
      #
      # letibot's own release workflow clones and builds llama.cpp with cmake to get past that. There is
      # no reason for this repository to repeat it: letibot PUBLISHES the result, and its asset is the
      # runtime — `harnessd`, `letibot-tui`, `letibot-askpass`, and the four llama libraries harnessd
      # links. Taking the published artifact at the pinned tag is better than rebuilding it here on
      # three counts: no toolchain beyond curl, the exact binaries and libraries that were TESTED, and
      # no second build of a fork of a fork.
      #
      # **THE ASSET'S NAME IS `letibot-<triple>`, not `harnessd-<triple>`** — the first cut asked for a
      # name letibot does not publish, which would have 404'd on a tag that exists.
      - name: Fetch the daemon and its libraries
        run: |
          set -eu
          ver="${{ env.LETIBOT_REF }}"
          base="https://github.com/${{ env.LETIBOT_REPO }}/releases/download/${ver}"
          curl -q -fsSL --proto '=https' --proto-redir '=https' \
            -o daemon.tar.gz "${base}/letibot-${{ matrix.triple }}.tar.gz"
          mkdir -p daemon-dist && tar -xzf daemon.tar.gz -C daemon-dist
          # The launcher is a SCRIPT IN THE REPOSITORY and is not in the asset, so it comes from
          # `LETIBOT_LAUNCHER_REF` — a COMMIT, not the asset tag, because the tag predates the
          # `LETIBOT_HEAD` hook this whole install depends on. See the env block for the two
          # measurements. **ONE `curl` AND NOT A FALLBACK CHAIN** — the first cut built this URL by
          # trimming the release URL's last component, and `${base%-*}` strips nothing here —
          # `v0.1.1` and the repo path carry no hyphen — so that attempt was guaranteed to 404 and
          # existed only to hide a URL that was never right. Measured: it did 404, on every run.
          curl -q -fsSL --proto '=https' --proto-redir '=https' \
            -o daemon-dist/letibot \
            "https://raw.githubusercontent.com/${{ env.LETIBOT_REPO }}/${{ env.LETIBOT_LAUNCHER_REF }}/scripts/letibot"
          chmod 755 daemon-dist/letibot
          echo "--- what we fetched ---"
          ls -la daemon-dist

      # **THE LAUNCHER MUST ACTUALLY READ `LETIBOT_HEAD`, and this step is why the whole install
      # is worth anything.** The archive ships `leticl-head-launch` and `leticl` exports
      # `LETIBOT_HEAD` pointing at it — so a launcher that does not read that name execs
      # `letibot-tui` instead: either absent (the install dies at first use) or, if we shipped it,
      # the RUST TUI under the name `leticl` with no error. Both are worse than a failed build.
      #
      # MEASURED, and this is not hypothetical: letibot's `v0.1.1` launcher is 901 lines and does
      # NOT contain the name; the hook landed later, at `ba97dbf`. A pin to the tag alone shipped
      # the wrong launcher, and nothing in any pipeline would have said so — the same shape as
      # `--version` passing on a head whose shim cannot load. Grep the name, and fail by name.
      - name: The launcher must read LETIBOT_HEAD
        run: |
          set -eu
          if ! grep -q 'LETIBOT_HEAD' daemon-dist/letibot; then
            echo "::error::the launcher at ${{ env.LETIBOT_LAUNCHER_REF }} does not read LETIBOT_HEAD"
            echo "::error::an install composed with it would exec letibot-tui, not leticl's head"
            echo "--- what it does read ---"
            grep -oE '\$\{?LETIBOT_[A-Z_]+' daemon-dist/letibot | sort -u
            exit 1
          fi
          echo "the launcher reads LETIBOT_HEAD:"
          grep -n 'LETIBOT_HEAD' daemon-dist/letibot | head -3

      # The triple is a claim about the binary. Check it against the runner's own
      # host rather than trusting the image name: a silent change to what
      # `ubuntu-latest` means would otherwise publish an x86_64 binary named
      # aarch64, which install.sh downloads and then fails to execute.
      - name: The runner must be the architecture we are claiming
        run: |
          set -eu
          host=$(uname -m)
          case "${{ matrix.triple }}:$host" in
            x86_64-unknown-linux-gnu:x86_64) ;;
            aarch64-unknown-linux-gnu:aarch64|aarch64-unknown-linux-gnu:arm64) ;;
            *) echo "::error::runner is $host, claiming ${{ matrix.triple }}"; exit 1 ;;
          esac

      # **THE HIGHLIGHTING SHIM, AND IT COULD NOT BE BUILT HERE UNTIL 2026-10-01.**
      # `native/hl/Cargo.toml` took rano by ABSOLUTE PATH, so this crate built on exactly one
      # machine — and the consequence reached the user: no archive ever contained
      # `libleticl_hl.so`, so a fresh install ran uncoloured and said nothing about it. The
      # manifest now pins rano's published tag, the same one letibot's three manifests use.
      #
      # **RUST IS HERE FOR THIS AND NOTHING ELSE.** The daemon is fetched, so this step is the only
      # one that compiles anything — and when the daemon build was removed, this one's toolchain went
      # with it. MEASURED by the second `act` run: *"cargo: command not found"*, exit 127, on a
      # workflow whose very next step asserts the shim loads. A toolchain belongs to the step that
      # needs it, and deleting a build is not deleting the language.
      #
      # A separate `--target-dir`, because this is its own workspace with its own lockfile.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build the highlighting shim
        run: cargo build --release --manifest-path native/hl/Cargo.toml --target-dir hl-target

      # **THE SHIM MUST LOAD, and `--version` does not prove that.** The head answers it without
      # ever touching the shim (`hl-available-p` is lazy), so a broken `.so` would pass every
      # check above and fail on the first file a person opens. This asks the shim directly.
      - name: The shim must load
        run: |
          set -eu
          so=hl-target/release/libleticl_hl.so
          [ -f "$so" ] || { echo "::error::no shim at $so"; exit 1; }
          file "$so" | grep -q 'shared object' || { echo "::error::$so is not a shared object"; exit 1; }
          # `hl_detect` with a path that has no language must answer 0, and it is `catch_unwind`-ed
          # internally, so a load failure is a process failure rather than a wrong number.
          python3 - "$so" <<'PY'
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.hl_detect.restype = ctypes.c_uint32
          lib.hl_detect.argtypes = [ctypes.c_char_p]
          rust = lib.hl_detect(b"src/main.rs")
          none = lib.hl_detect(b"no-such-extension.zzz")
          print("hl_detect(main.rs) =", rust, " hl_detect(.zzz) =", none)
          assert rust != 0, "the shim did not recognise Rust"
          assert none == 0, "the shim invented a language for an unknown extension"
          PY

      # SBCL, and only for the build. `libsqlite3-0` is not needed to freeze — the
      # load is inside a `handler-case` — but it IS needed to run the smoke test
      # below, which is the point of installing it here.
      - name: Install SBCL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sbcl libsqlite3-0

      - name: Build the head
        run: sbcl --script freeze.lisp

      # **THE HEAD MUST RUN BEFORE IT IS PACKAGED.** A Lisp image that freezes and
      # then cannot start is the failure this catches, and it is not hypothetical:
      # the image embeds absolute paths and a compile error in one file leaves a
      # binary that dies on load. `--version` is the cheapest thing that proves the
      # runtime came up.
      - name: The head must run
        run: |
          set -eu
          [ -x bin/leticl-head ] || { echo "::error::no image at bin/leticl-head"; exit 1; }
          # **`-h` AND NOT `--version`, and install.sh learned the same thing the same way.** The
          # image is a frozen SBCL and SBCL's RUNTIME owns `--help` and `--version`: they are parsed
          # before any Lisp runs, so `--version` prints `SBCL 2.6.0.debian` and `--help` prints a page
          # about `--core`. Measured on a clean box. `-h` reaches the head's own argument list.
          bin/leticl-head -h >/dev/null || { echo "::error::the head did not answer -h"; exit 1; }

      # **THE LIBRARIES HARNESSD LINKS MUST BE BESIDE IT.** `libllama.so.0`, `libggml.so.0`,
      # `libggml-cpu.so.0` and `libggml-base.so.0` come from the same asset, and harnessd carries an
      # `$ORIGIN` rpath so it finds them as siblings. This is also the class of failure letibot found
      # on arm64 the same day — a binary that compiles and cannot execute because one library in
      # `DT_NEEDED` was not there — so it is CHECKED rather than assumed.
      #
      # **AND THE `ldd` HALF OF THIS CHECK CAN ONLY PASS, WHICH IS THE DEFECT — FOUND ON A CLEAN BOX
      # AND NOT HERE.** The first version ran `ldd harnessd | grep 'not found'`, which on a GitHub
      # runner resolves EVERYTHING, including the libraries that come from the HOST rather than from
      # the archive: `libstdc++.so.6`, `libgomp.so.1` (needed by `libggml-cpu`), `libsqlite3.so.0`.
      # A runner has all three, so the step was green by construction — and the first person to
      # install on a minimal box got
      #
      #   harnessd: error while loading shared libraries: libgomp.so.1: cannot open shared object file
      #
      # with the daemon exiting 1 while every step here had passed. **An assertion that cannot fail
      # is not an assertion**, and the fix is to ask the question the user's box asks: which of these
      # does the ARCHIVE provide, and which must the host?
      - name: The daemon and its libraries are all present
        run: |
          set -eu
          # From the archive — these must be here, and nothing else supplies them.
          for want in harnessd letibot libllama.so.0 libggml.so.0 libggml-cpu.so.0 libggml-base.so.0; do
            [ -f "daemon-dist/$want" ] || { echo "::error::the letibot asset has no $want"; exit 1; }
          done
          echo "all six present"
          # **THE HOST'S OWN, NAMED.** These are NOT in the asset and must not be: they belong to the
          # system, and shipping a copy would be a libc-compatibility claim nobody measured. The
          # runner has them, so the check that matters is not *do they resolve* but *is the set of
          # things-only-the-host-can-supply exactly the set we tell the user to install*.
          #
          # `libgomp.so.1` is found by `libggml-cpu`, `libstdc++.so.6` by `libllama`, and
          # `libsqlite3.so.0` by `harnessd` itself. letibot's installer names the same three, and the
          # third was ITS correction to MY report — I had found two by hand and it read the tree.
          HOST_LIBS="libstdc++.so.6 libgomp.so.1 libsqlite3.so.0"
          # Everything `harnessd` and the four libraries need, transitively, as `ldd` sees it.
          needed=$(ldd daemon-dist/harnessd daemon-dist/libllama.so.0 daemon-dist/libggml.so.0 \
                       daemon-dist/libggml-cpu.so.0 daemon-dist/libggml-base.so.0 2>/dev/null \
                   | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p;s/^[[:space:]]*\(\/[^ ]*\) .*/\1/p' \
                   | sort -u)
          missing=0
          for lib in $HOST_LIBS; do
            if ! printf '%s\n' "$needed" | grep -q "/$lib$"; then
              echo "::error::the archive no longer needs $lib — remove it from HOST_LIBS and from"
              echo "::error::install.sh's refusal, or the pair has drifted apart"
              missing=1
            fi
          done
          # **AND NOTHING ELSE MAY BE UNRESOLVED**, which is the check that would have caught the bug:
          # a library neither in the archive nor in the host's named set is one the user was never told
          # to install.
          for path in $needed; do
            base=$(basename "$path")
            case " $HOST_LIBS " in *" $base "*) continue ;; esac
            if [ ! -f "daemon-dist/$base" ]; then
              echo "::error::harnessd needs $base, which is neither in the archive nor in HOST_LIBS"
              echo "::error::an install on a minimal box would fail at first run; add it to the list"
              echo "::error::install.sh names, or ship it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all ten resolve: six from the archive, three named as the host's own"

      - name: Package
        env:
          # `make-dist.sh` looks under `daemon/` for a source build; this tells it the fetched
          # layout instead, so the packaging script does not need to know which route was taken.
          LETIBOT_DIST: ${{ github.workspace }}/daemon-dist
        run: sh scripts/make-dist.sh ${{ matrix.triple }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: leticl-${{ matrix.triple }}
          path: dist/leticl-${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  # Publishes the assets as a release, which is what makes `releases/latest`
  # resolve. Separate from `build` so a failure to publish does not look like a
  # failure to compile.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist/

      # The same check the installer's own extraction does, run once here so a bad
      # archive is caught at publish time rather than by the first user.
      - name: Every asset must extract to all ten files
        run: |
          set -eu
          for f in dist/*.tar.gz; do
            d=$(mktemp -d)
            tar -xzf "$f" -C "$d"
            for want in leticl-head harnessd letibot libleticl_hl.so \
                        libllama.so.0 libggml.so.0 libggml-cpu.so.0 libggml-base.so.0 \
                        leticl leticl-head-launch; do
              if [ ! -f "$d/$want" ]; then
                echo "::error::$f is missing $want"
                exit 1
              fi
            done
            [ -x "$d/leticl-head" ] || { echo "::error::$f: leticl-head is not executable"; exit 1; }
            [ -x "$d/harnessd" ]    || { echo "::error::$f: harnessd is not executable"; exit 1; }
            rm -rf "$d"
          done
          echo "$(ls dist/*.tar.gz | wc -l) assets, all complete"

      # `gh` rather than a release action: it is already on the runner, so this is
      # one less third-party action to trust in the path that publishes binaries
      # people download and run.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*.tar.gz
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
